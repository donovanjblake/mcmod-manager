name: Cargo Build

on:
  workflow_call:
    inputs:
      release:
        description: Whether to do a release build.
        type: boolean
        default: false

env:
  RUST_BACKTRACE: '1'

jobs:
  cargo-lint:
    name: Cargo Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Cargo Format
      run: cargo fmt --check
    - name: Cargo Clippy
      run: cargo clippy --tests -- -D warnings -D clippy::pedantic
  cargo-build:
    name: Cargo Build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
        - os: ubunutu-latest
          name: linux
          archive: tar
          dot_minecraft: '$HOME/.minecraft'
        - os: macos-latest
          name: macos
          archive: tar
          dot_minecraft: '$HOME/.minecraft'
        - os: windows-latest
          name: windows
          archive: zip
          dot_minecraft: '$env:APPDATA/.minecraft'
    runs-on: ${{ matrix.os }}
    env:
      release-dir: mcmod_manager-${{ matrix.name }}-${{ github.ref_name }}
    steps:
    - uses: actions/checkout@v5
    - name: Cargo Build
      run: cargo build
    - name: Cargo Test
      run: cargo test
    - name: Cargo Build
      run: cargo build ${{ inputs.release && '--release' }}
    - name: Prepare Archive
      run: |
        mkdir ${{ env.release-dir }}
        cp target/release/mcmod ${{ env.release-dir }}
        cp README.md ${{ env.release-dir }}
        cp -r examples ${{ env.release-dir }}/examples
    - name: Make Tar Archive
      if: ${{ matrix.archive == 'tar' }}
      run: tar czvf ${{ env.release-dir }}.tar.gz ${{ env.release-dir }}
    - name: Make Zip Archive
      if: ${{ matrix.archive == 'zip' }}
      run: zip -r ${{ env.release-dir }}.zip ${{ env.release-dir }}
    - name: Setup .minecraft
      run: mkdir ${{ matrix.dot_minecraft }}
    - name: Run Integration Test
      run: mcmod examples/integration_test.toml
    - uses: actions/upload-artifact@v6
      with:
        if-no-files-found: error
        path: |
          ${{ env.release-dir }}.tar.gz
          ${{ env.release-dir }}.zip
