name: Pull Request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: '1'

jobs:
  conventional_name:
    uses: ./.github/workflows/conventional_name.yml
    with:
      name: ${{ github.event.pull_request.title }}
  target:
    uses: ./.github/workflows/target.yml
