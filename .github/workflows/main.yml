name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-lint:
    name: Cargo Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Cargo Format
      run: cargo fmt --check
    - name: Cargo Clippy
      run: cargo clippy --tests -- -D warnings -D clippy::pedantic
  cargo-build:
    name: Cargo Build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Cargo Build
      run: cargo build
    - uses: actions/upload-artifact@v6
      with:
        path: target/debug/mcmod
        name: mcmod-${{ matrix.os }}
    - name: Cargo Test
      run: cargo test
