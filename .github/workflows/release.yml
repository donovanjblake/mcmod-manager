name: Release

on:
  push:
    tags: ['v*']

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check Version
      run: |
        cargo_version=$(awk -F '"' '/^version = / {print "v"$2}' Cargo.toml)
        echo "Version in cargo.toml: $cargo_version"
        tag_version='${{ github.ref_name }}'
        echo "Version in tag: $tag_version"
        if [[ -z "$cargo_version" ]]; then
          echo "Version not found."
          exit 1
        elif [[ "$cargo_version" != "$tag_version" ]]; then
          echo "Versions do not match."
          exit 1
        fi
        echo "Versions match!"
  target:
    needs: [check-version]
    uses: ./.github/workflows/target.yml
    with:
      release: true
  upload-release:
    name: Upload Release
    needs: [target]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v7
    - uses: softprops/action-gh-release@v2.5.0
      with:
        token: ${{ secrets.RELEASE_TOKEN }}
        files: '*'
